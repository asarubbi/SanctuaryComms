name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install zip utility
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build zip package
        run: |
          TAG="${GITHUB_REF_NAME}"
          zip -r "SanctuaryComms-${TAG}.zip" \
            README.md \
            SanctuaryComms.toc \
            SanctuaryComms.lua \
            SanctuaryComms.xml

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ github.ref_name }}        # v0.1.0-alpha
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: true

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./SanctuaryComms-${{ github.ref_name }}.zip
          asset_name: SanctuaryComms-${{ github.ref_name }}.zip
          asset_content_type: application/zip
