name: Release

on:
  push:
    tags:
      - "v*"          # trigger on tags like v0.1.0, v0.1.0-alpha
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required so gh or API can create releases

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install zip utility
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build zip package
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Building SanctuaryComms-${TAG}.zip"
          zip -r "SanctuaryComms-${TAG}.zip" \
            README.md \
            SanctuaryComms.toc \
            SanctuaryComms.lua \
            SanctuaryComms.xml

      - name: Create GitHub release with gh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # built in token, do not override with a secret of same name
        run: |
          TAG="${GITHUB_REF_NAME}"
          ls -l
          gh release create "$TAG" "SanctuaryComms-${TAG}.zip" \
            --title "$TAG" \
            --notes ""
