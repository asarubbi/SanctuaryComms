name: Create Addon Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # CF_API_KEY: ${{ secrets.CF_API_KEY }}   # uncomment to push to CurseForge
          # WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}  # uncomment to push to Wago
